name: CI

on:
  push:
    branches:
      - free-product-orders
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run tests
        run: go test ./cmd/server ./internal/service ./internal/http/handlers/public ./internal/http/handlers/admin
